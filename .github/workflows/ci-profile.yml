name: Kafka checkpoint evidence
on:
  workflow_dispatch:
    inputs:
      native_run:
        description: Existing compatible debug native producer
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: kafka-checkpoint-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  historical-cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JAVA_TOOL_OPTIONS: '-XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=512m'
      SF_KAFKA_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@v6
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          cache: maven
      - name: Verify the existing native producer
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: python3 bin/ci_native_source.py --run "$NATIVE_RUN"
      - uses: actions/download-artifact@v5
        with:
          name: ${{ steps.native.outputs.artifact }}
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-native
      - name: Stage the verified native libraries
        run: >-
          python3 bin/ci_native_test_artifact.py --input "$RUNNER_TEMP/original-native"
          --output native/target/debug
      - name: Resolve dependencies before the four-case diagnostic
        run: python3 bin/ci-maven-dependencies.py --profile flink-1.18,canonical-kafka --projects streamfusion-runtime --also-make
      - name: Run the historical parameter with original four-fork contention
        env:
          SF_CANONICAL_CDS_DIR: ${{ runner.temp }}/canonical-cds
        run: |
          mkdir -p "$RUNNER_TEMP/canonical-fixtures"
          mvn -B -ntp -Pflink-1.18,canonical-kafka -pl streamfusion-runtime -am test \
            -Dnative.build.skip=true -Dsf.protobuf.checkStaleness=true \
            -Dtest=CanonicalKafkaPipelineFailureJobTest,CanonicalKafkaPipelineProcessFailureJobTest,CanonicalKafkaSinkFailureJobTest,CanonicalKafkaSinkProcessFailureJobTest \
            -Dsf.canonical.kafka.fixture.smoke=true -Dsurefire.failIfNoSpecifiedTests=false \
            -Dsf.testForks=4 -Dsf.testReuseForks=false \
            "-Dsf.extraJvmArgs=-Xmx1g -Djava.io.tmpdir=$RUNNER_TEMP/canonical-fixtures"
      - name: Retain the actual configuration and fault-boundary metadata
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          temporary = Path(os.environ['RUNNER_TEMP'])
          output = temporary / 'checkpoint-evidence'
          output.mkdir()
          rows = []
          for root in (temporary / 'canonical-fixtures').rglob('switched'):
              if not root.is_dir():
                  continue
              snapshots = {}
              for path in root.glob('*checkpoint-counts.tsv'):
                  snapshots[path.name] = {key: int(value) for key, value in
                                          (line.split('\t') for line in path.read_text().splitlines())}
              rows.append(dict(pipeline=(root / 'kafka-input').exists(),
                  task_loss=(root / 'failed-terminate-task-manager').exists(),
                  ordinary=(root / 'ordinary-sql').exists(),
                  native_first=int((root / 'prefix-native-rows').read_text()) > 0
                      if (root / 'prefix-native-rows').exists() else None,
                  snapshots=snapshots,
                  savepoint_ids={path.name: int(path.read_text()) for path in root.glob('*checkpoint-id.tsv')},
                  plans={path.name: path.read_text() for path in root.glob('*-plan.txt')},
                  diagnostic_errors={path.name:path.read_text() for path in root.glob('*checkpoint-error.txt')}))
          reports = []
          for path in Path('streamfusion-runtime/target/surefire-reports').glob('TEST-tech.streamfusion.CanonicalKafka*.xml'):
              suite = ET.parse(path).getroot()
              reports.append(dict(name=suite.get('name'), **{key:int(suite.get(key,0)) for key in ('tests','failures','errors','skipped')}))
          result = dict(head=os.environ['GITHUB_SHA'], flink='1.18', jdk='17', forks=4,
                        selection='original ordinary=false (compiled plan),nativeFirst=false,incrementing provider in four original failure classes',
                        rows=rows, reports=reports)
          (output / 'report.json').write_text(json.dumps(result, indent=2)+'\n')
          print(json.dumps(result, indent=2))
          expected = {'tech.streamfusion.CanonicalKafka'+name+'JobTest' for name in
                      ('PipelineFailure','PipelineProcessFailure','SinkFailure','SinkProcessFailure')}
          assert {row['name'] for row in reports} == expected and len(reports) == 4
          assert all(row['tests']==1 and all(row[key]==0 for key in ('failures','errors','skipped')) for row in reports)
          assert len(rows)==4 and {(row['pipeline'],row['task_loss']) for row in rows} == {(p,t) for p in (True,False) for t in (True,False)}
          for row in rows:
              assert not row['ordinary'] and not row['native_first'] and not row['diagnostic_errors'], row
              assert 'native-kafka-serialization' in row['plans']['failed-plan.txt'], row
              assert row['snapshots']['failed-checkpoint-counts.tsv']['interval_ms']==3600000, row
              if row['task_loss']:
                  assert 'failed-after-fault-checkpoint-counts.tsv' in row['snapshots'], row
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kafka-checkpoint-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/checkpoint-evidence/report.json
            streamfusion-runtime/target/surefire-reports/*.xml
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kafka-checkpoint-failure-context-${{ github.sha }}
          path: |
            ${{ runner.temp }}/canonical-fixtures/**/switched/*.log
            ${{ runner.temp }}/canonical-fixtures/**/switched/*.tsv
            ${{ runner.temp }}/canonical-fixtures/**/switched/*.txt
            ${{ runner.temp }}/canonical-fixtures/**/switched/*.json
            ${{ runner.temp }}/canonical-fixtures/**/switched/*.sql
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove diagnostic fixtures and native copies
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          temporary = Path(os.environ['RUNNER_TEMP'])
          for path in (temporary/'canonical-fixtures',temporary/'canonical-cds',
                       temporary/'original-native',temporary/'checkpoint-evidence',Path('native/target/debug')):
              shutil.rmtree(path,ignore_errors=True)
          PY
