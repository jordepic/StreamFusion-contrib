name: Historical Kafka failure reproduction
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: kafka-original-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      JAVA_TOOL_OPTIONS: '-XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=512m'
      SF_KAFKA_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Require unchanged historical production and fixture inputs
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          base = '2a304d57757d01bfdd6804f63a23efa39732635c'
          allowed = {'.github/workflows/ci-profile.yml','docs/ci.md',
                     'src/test/java/tech/streamfusion/CanonicalKafkaSinkJobTest.java',
                     'src/test/java/org/example/canonical/CanonicalKafkaSinkJobWorker.java'}
          changed = set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed == allowed, changed
          parent=Path('src/test/java/tech/streamfusion/CanonicalKafkaSinkJobTest.java')
          original=subprocess.check_output(['git','show',base+':'+str(parent)],text=True)
          current=parent.read_text()
          for start,end in [('  static Stream<Arguments> cases()', '  @ParameterizedTest'),
                            ('  @ParameterizedTest', '  private static void assertRows(')]:
              assert current[current.index(start):current.index(end)] == original[original.index(start):original.index(end)], (start,end)
          tree = subprocess.check_output(['git','rev-parse','HEAD:native'],text=True).strip()
          assert tree == '7c4f8c408c46ab7c6b712e9880850b8b06c18387', tree
          root = Path(os.environ['RUNNER_TEMP'])/'historical-kafka'
          root.mkdir()
          (root/'provenance.json').write_text(json.dumps(dict(
              source=base, diagnostic=os.environ['GITHUB_SHA'], native_tree=tree,
              changed_files=sorted(changed), cargo_lock_sha256=hashlib.sha256(Path('native/Cargo.lock').read_bytes()).hexdigest(),
              runner_image=os.environ.get('ImageVersion'), java_tool_options=os.environ['JAVA_TOOL_OPTIONS'],
              build_recipe='cargo build --workspace --lib --locked --timings; original debug flags',
              note='Original production/native/SQL/case providers/assertions; only read-only failure observations added'),indent=2)+'\n')
          PY
      - run: python3 bin/ci-free-disk.py
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: debug-jvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          cache: maven
      - name: Rebuild the expired historical debug runtime with its original recipe
        working-directory: native
        run: cargo build --workspace --lib --locked --timings
      - name: Verify JNI exports and retain only the Kafka test runtime
        run: |
          python3 bin/check-native-workspace.py --libraries native/target/debug
          python3 bin/ci_native_test_artifact.py --input native/target/debug \
            --output "$RUNNER_TEMP/historical-kafka/native"
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'historical-kafka'
          needed={'libstreamfusion.so','libstreamfusion_json.so','libstreamfusion_kafka.so'}
          for path in (root/'native').glob('*.so'):
              if path.name not in needed: path.unlink()
          paths=list((root/'native').glob('*.so'))
          assert {path.name for path in paths}==needed
          provenance=json.loads((root/'provenance.json').read_text())
          provenance['native_sha256']={path.name:hashlib.sha256(path.read_bytes()).hexdigest() for path in paths}
          provenance['rustc']=subprocess.check_output(['rustc','-Vv'],text=True)
          flags=subprocess.run(['java','-XX:+PrintCommandLineFlags','-version'],capture_output=True,text=True,check=True)
          provenance['java_effective_flags']=flags.stdout+flags.stderr
          assert 'UseG1GC' in provenance['java_effective_flags']
          (root/'provenance.json').write_text(json.dumps(provenance,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: historical-kafka-debug-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/historical-kafka/native/*.so
            ${{ runner.temp }}/historical-kafka/provenance.json
          compression-level: 1
          retention-days: 3
          if-no-files-found: error
      - name: Use the original stripped test payload
        run: cp "$RUNNER_TEMP/historical-kafka/native/"*.so native/target/debug/
      - name: Resolve only the historical Kafka reactor
        run: python3 bin/ci-maven-dependencies.py --profile flink-1.18,canonical-kafka --projects streamfusion-runtime --also-make
      - name: Run original providers with their original four-fork contention
        env:
          SF_CANONICAL_CDS_DIR: ${{ runner.temp }}/historical-kafka/cds
        run: |
          mkdir -p "$RUNNER_TEMP/historical-kafka/runtime" "$RUNNER_TEMP/historical-kafka/broker"
          status=0
          for trial in 1 2 3; do
            result=0
            mvn -B -ntp -Pflink-1.18,canonical-kafka -pl streamfusion-runtime -am test \
              -Dnative.build.skip=true -Dsf.protobuf.checkStaleness=true \
              -Dtest=CanonicalKafkaPipelineFailureJobTest,CanonicalKafkaPipelineProcessFailureJobTest,CanonicalKafkaSinkFailureJobTest,CanonicalKafkaSinkProcessFailureJobTest \
              -Dsurefire.failIfNoSpecifiedTests=false -Dsf.testForks=4 -Dsf.testReuseForks=false \
              "-Dsf.extraJvmArgs=-Xmx1g -Djava.io.tmpdir=$RUNNER_TEMP/historical-kafka/runtime -Dsf.canonical.kafka.failureLogs=$RUNNER_TEMP/historical-kafka/broker" || result=$?
            mkdir -p "$RUNNER_TEMP/historical-kafka/trial-$trial"
            cp streamfusion-runtime/target/surefire-reports/TEST-tech.streamfusion.CanonicalKafka*.xml "$RUNNER_TEMP/historical-kafka/trial-$trial/"
            printf '%s\n' "$result" > "$RUNNER_TEMP/historical-kafka/trial-$trial/exit-code.txt"
            if [[ "$result" != 0 ]]; then status="$result"; break; fi
          done
          exit "$status"
      - name: Summarize original-case outcomes and retained fault evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path(os.environ['RUNNER_TEMP'])/'historical-kafka'
          root.mkdir(exist_ok=True)
          reports=[]
          for path in sorted(root.glob('trial-*/*.xml')):
              suite=ET.parse(path).getroot()
              reports.append(dict(trial=path.parent.name,name=suite.get('name'),
                  **{key:int(suite.get(key,0)) for key in ('tests','failures','errors','skipped')},
                  cases=[dict(name=case.get('name'),classname=case.get('classname'),
                              failure='\n'.join((node.text or '') for node in case if node.tag in ('failure','error')))
                         for case in suite.findall('testcase')]))
          retained=[]
          for fixture in (root/'runtime').rglob('switched'):
              if not fixture.is_dir(): continue
              retained.append(dict(path=str(fixture.relative_to(root)),
                  checkpoint_counts={p.name:p.read_text() for p in fixture.glob('*checkpoint-counts.tsv')},
                  plans={p.name:p.read_text() for p in fixture.glob('*-plan.txt')}))
          result=dict(head=os.environ['GITHUB_SHA'],reports=reports,retained_failed_fixtures=retained)
          (root/'result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(dict(actual_invocations=sum(row['tests'] for row in reports),
                                failures=sum(row['failures'] for row in reports),errors=sum(row['errors'] for row in reports)),indent=2))
          expected={'tech.streamfusion.CanonicalKafka'+name+'JobTest' for name in
                    ('PipelineFailure','PipelineProcessFailure','SinkFailure','SinkProcessFailure')}
          for trial in sorted({row['trial'] for row in reports}):
              rows=[row for row in reports if row['trial']==trial]
              assert {row['name'] for row in rows}==expected and len(rows)==4, rows
              assert all(row['tests']==4 and row['skipped']==0 for row in rows),rows
          if reports and not any(row['failures'] or row['errors'] for row in reports):
              assert sum(row['tests'] for row in reports)==48
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-kafka-results-${{ github.sha }}
          path: |
            ${{ runner.temp }}/historical-kafka/result.json
            ${{ runner.temp }}/historical-kafka/provenance.json
            ${{ runner.temp }}/historical-kafka/trial-*/*
            ${{ runner.temp }}/historical-kafka/broker/*
            ${{ runner.temp }}/historical-kafka/runtime/**/switched/*.log
            ${{ runner.temp }}/historical-kafka/runtime/**/switched/*.txt
            ${{ runner.temp }}/historical-kafka/runtime/**/switched/*.tsv
            ${{ runner.temp }}/historical-kafka/runtime/**/switched/*.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove task fixtures and staging after evidence upload
        if: always()
        run: |
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          shutil.rmtree(Path(os.environ['RUNNER_TEMP'])/'historical-kafka',ignore_errors=True)
          PY
