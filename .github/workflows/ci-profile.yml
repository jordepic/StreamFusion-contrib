name: Original Kafka mixed workload
on:
  workflow_dispatch:
    inputs:
      native_run:
        description: Original-source debug producer
        type: string
        required: true
        default: '43932231295'
permissions:
  contents: read
  actions: read
concurrency:
  group: kafka-original-mixed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-mixed-workload:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      JAVA_TOOL_OPTIONS: '-XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=512m'
      SF_KAFKA_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3
      - name: Require original production, providers and assertions
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          base='2a304d57757d01bfdd6804f63a23efa39732635c'
          allowed={'.github/workflows/ci-profile.yml','docs/ci.md','bin/profile-kafka-original-mixed.py',
                   'src/test/java/tech/streamfusion/CanonicalKafkaSinkJobTest.java',
                   'src/test/java/org/example/canonical/CanonicalKafkaSinkJobWorker.java'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed==allowed,changed
          assert subprocess.check_output(['git','rev-parse','HEAD:native'],text=True).strip()=='7c4f8c408c46ab7c6b712e9880850b8b06c18387'
          parent=Path('src/test/java/tech/streamfusion/CanonicalKafkaSinkJobTest.java')
          original=subprocess.check_output(['git','show',base+':'+str(parent)],text=True)
          current=parent.read_text()
          for start,end in [('  static Stream<Arguments> cases()','  @ParameterizedTest'),
                            ('  @ParameterizedTest','  private static void assertRows(')]:
              assert current[current.index(start):current.index(end)]==original[original.index(start):original.index(end)]
          output=Path(os.environ['RUNNER_TEMP'])/'original-mixed'
          output.mkdir()
          (output/'source.json').write_text(json.dumps(dict(original=base,head=os.environ['GITHUB_SHA'],
              changed_files=sorted(changed),available_processors=os.cpu_count(),runner_image=os.environ.get('ImageVersion'),
              selection='Four original Kafka providers with original three coexecuting classes; neighbor remainder canceled after Kafka XML'),indent=2)+'\n')
          PY
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          cache: maven
      - name: Verify the successful original debug producer
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path],timeout=30))
          run=os.environ['NATIVE_RUN']
          assert run.isdigit()
          repository=os.environ['GITHUB_REPOSITORY']
          producer=api(f'repos/{repository}/actions/runs/{run}')
          assert producer['status']=='completed' and producer['conclusion']=='success'
          assert producer['head_sha']=='fe35062666fa35848b634de92dcff0c223bb59b4'
          artifacts=api(f'repos/{repository}/actions/runs/{run}/artifacts?per_page=100')['artifacts']
          matched=[a for a in artifacts if a['name']=='historical-kafka-debug-native-'+producer['head_sha'] and not a['expired']]
          assert len(matched)==1
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('artifact='+str(matched[0]['id'])+'\n')
          PY
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ steps.native.outputs.artifact }}
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-kafka-producer
      - name: Verify and stage the three original debug libraries
        run: |
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          downloaded=root/'original-kafka-producer'
          provenance=list(downloaded.rglob('provenance.json'))
          assert len(provenance)==1
          provenance=json.loads(provenance[0].read_text())
          assert provenance['source']=='2a304d57757d01bfdd6804f63a23efa39732635c'
          assert provenance['diagnostic']=='fe35062666fa35848b634de92dcff0c223bb59b4'
          assert provenance['native_tree']=='7c4f8c408c46ab7c6b712e9880850b8b06c18387'
          assert provenance['build_recipe']=='cargo build --workspace --lib --locked --timings; original debug flags'
          assert hashlib.sha256(Path('native/Cargo.lock').read_bytes()).hexdigest()==provenance['cargo_lock_sha256']
          expected={'libstreamfusion.so','libstreamfusion_json.so','libstreamfusion_kafka.so'}
          libraries=list(downloaded.rglob('*.so'))
          assert len(libraries)==3 and {p.name for p in libraries}==expected
          target=Path('native/target/debug')
          target.mkdir(parents=True)
          for library in libraries:
              assert hashlib.sha256(library.read_bytes()).hexdigest()==provenance['native_sha256'][library.name]
              shutil.copyfile(library,target/library.name)
          flags=subprocess.run(['java','-XX:+PrintCommandLineFlags','-version'],capture_output=True,text=True,check=True)
          assert 'UseG1GC' in flags.stdout
          provenance['consumer_java_flags']=flags.stdout+flags.stderr
          (root/'original-mixed/producer.json').write_text(json.dumps(provenance,indent=2)+'\n')
          PY
      - name: Resolve the original canonical reactor
        run: python3 bin/ci-maven-dependencies.py --profile flink-1.18,canonical-kafka --projects streamfusion-runtime --also-make
      - name: Replay original initial contention until the Kafka class completes
        env:
          SF_CANONICAL_CDS_DIR: ${{ runner.temp }}/original-mixed/cds
        run: |
          mkdir -p "$RUNNER_TEMP/original-mixed/runtime" "$RUNNER_TEMP/original-mixed/broker"
          docker ps -aq --filter label=org.testcontainers=true > "$RUNNER_TEMP/original-mixed/containers-before.txt"
          python3 bin/profile-kafka-original-mixed.py \
            --reports streamfusion-runtime/target/surefire-reports \
            --output "$RUNNER_TEMP/original-mixed/observation" --timeout 900 -- \
            mvn -B -ntp -Pflink-1.18,canonical-kafka -pl streamfusion-runtime -am test \
            -Dnative.build.skip=true -Dsf.protobuf.checkStaleness=true \
            -Dtest=CanonicalKafkaPipelineFailureJobTest,CanonicalOrdinaryRegularJoinJobTest,CanonicalManagedUdfTimestampKeyJobTest,CanonicalGlobalHiddenExtremaJobTest \
            -Dsurefire.failIfNoSpecifiedTests=false -Dsf.testForks=4 -Dsf.testReuseForks=false \
            "-Dsf.extraJvmArgs=-Xmx1g -Djava.io.tmpdir=$RUNNER_TEMP/original-mixed/runtime -Dsf.canonical.kafka.failureLogs=$RUNNER_TEMP/original-mixed/broker"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kafka-original-mixed-${{ github.sha }}
          path: |
            ${{ runner.temp }}/original-mixed/source.json
            ${{ runner.temp }}/original-mixed/producer.json
            ${{ runner.temp }}/original-mixed/observation/
            ${{ runner.temp }}/original-mixed/broker/
            ${{ runner.temp }}/original-mixed/runtime/**/switched/*.log
            ${{ runner.temp }}/original-mixed/runtime/**/switched/*.txt
            ${{ runner.temp }}/original-mixed/runtime/**/switched/*.tsv
            ${{ runner.temp }}/original-mixed/runtime/**/switched/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove owned containers, fixtures and native copies
        if: always()
        run: |
          python3 - <<'PY'
          import os,shutil,subprocess
          from pathlib import Path
          temporary=Path(os.environ['RUNNER_TEMP'])
          root=temporary/'original-mixed'
          before=root/'containers-before.txt'
          try:
              if before.exists():
                  previous=set(before.read_text().split())
                  current=set(subprocess.check_output(['docker','ps','-aq','--filter','label=org.testcontainers=true'],text=True).split())
                  owned=sorted(current-previous)
                  if owned:subprocess.run(['docker','rm','-f',*owned],check=True)
          finally:
              for directory in (root,temporary/'original-kafka-producer',Path('native/target/debug')):
                  shutil.rmtree(directory,ignore_errors=True)
          PY
