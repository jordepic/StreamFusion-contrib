name: Canonical worker collector profile

on:
  workflow_dispatch:
    inputs:
      native_run:
        description: Existing compatible debug-native producer
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: canonical-collector-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-collectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        line: ['1.18', '2.2']
    env:
      PROFILES: ${{ matrix.line == '1.18' && 'flink-1.18,canonical-kafka' || 'canonical-kafka' }}
      JAVA_TOOL_OPTIONS: '-XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=512m'
      SF_KAFKA_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@v6
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          cache: maven
      - name: Verify the existing native producer
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: python3 bin/ci_native_source.py --run "$NATIVE_RUN"
      - uses: actions/download-artifact@v5
        with:
          name: ${{ steps.native.outputs.artifact }}
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-native
      - name: Stage identical debug libraries
        run: >-
          python3 bin/ci_native_test_artifact.py --input "$RUNNER_TEMP/original-native"
          --output native/target/debug
      - name: Resolve dependencies before paired trials
        run: python3 bin/ci-maven-dependencies.py --profile "$PROFILES" --projects streamfusion-runtime --also-make
      - name: Alternate identical original providers under G1 and Serial
        env:
          SF_CANONICAL_CDS_DIR: ${{ runner.temp }}/canonical-cds
        run: |
          selection='CanonicalKafkaPipelineFailureJobTest,CanonicalKafkaPipelineProcessFailureJobTest,CanonicalKafkaSinkFailureJobTest,CanonicalKafkaSinkProcessFailureJobTest'
          mkdir -p "$RUNNER_TEMP/canonical-fixtures" "$RUNNER_TEMP/collector-profile"
          base_flags="$JAVA_TOOL_OPTIONS"
          for trial in 0 1 2 3; do
            if (( trial % 2 == 0 )); then collectors='Serial G1'; else collectors='G1 Serial'; fi
            for collector in $collectors; do
              export JAVA_TOOL_OPTIONS="$base_flags -XX:+Use${collector}GC"
              evidence="$RUNNER_TEMP/collector-profile/trial-$trial-$collector"
              mkdir -p "$evidence"
              java -Xmx1g -XX:+PrintCommandLineFlags -version > "$evidence/jvm-flags.log" 2>&1
              started=$(date +%s%N)
              mvn -B -ntp -P"$PROFILES" -pl streamfusion-runtime -am test \
                -Dnative.build.skip=true -Dsf.protobuf.checkStaleness=true \
                "-Dtest=$selection" -Dsf.canonical.kafka.fixture.smoke=false \
                -Dsurefire.failIfNoSpecifiedTests=false \
                -Dsf.testForks=4 -Dsf.testReuseForks=false \
                "-Dsf.extraJvmArgs=-Xmx1g -Djava.io.tmpdir=$RUNNER_TEMP/canonical-fixtures"
              finished=$(date +%s%N)
              cp streamfusion-runtime/target/surefire-reports/TEST-tech.streamfusion.CanonicalKafka*.xml "$evidence/"
              LINE='${{ matrix.line }}' TRIAL="$trial" COLLECTOR="$collector" EVIDENCE="$evidence" \
                STARTED_NS="$started" FINISHED_NS="$finished" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          directory = Path(os.environ['EVIDENCE'])
          collector = os.environ['COLLECTOR']
          flags = (directory / 'jvm-flags.log').read_text()
          assert '-XX:+Use' + collector + 'GC' in flags, flags
          expected = {'CanonicalKafka' + name + 'JobTest': 4 if os.environ['LINE'] == '1.18' else 8
                      for name in ('PipelineFailure', 'PipelineProcessFailure', 'SinkFailure', 'SinkProcessFailure')}
          observed = {}
          for path in directory.glob('TEST-*.xml'):
              suite = ET.parse(path).getroot()
              name = suite.get('name').rsplit('.', 1)[-1]
              assert name not in observed, name
              observed[name] = int(suite.get('tests', 0))
              assert all(int(suite.get(key, 0)) == 0 for key in ('failures', 'errors', 'skipped')), name
          assert observed == expected, (observed, expected)
          result = dict(flink_line=os.environ['LINE'], collector=collector, trial=int(os.environ['TRIAL']),
                        warmup=os.environ['TRIAL'] == '0', tests=sum(observed.values()),
                        wall_seconds=(int(os.environ['FINISHED_NS']) - int(os.environ['STARTED_NS'])) / 1e9)
          (directory / 'trial.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-collector-profile-flink${{ matrix.line }}-jdk17
          path: |
            ${{ runner.temp }}/collector-profile/
            **/target/surefire-reports/*.xml
            ${{ runner.temp }}/canonical-fixtures/**/switched/*.log
            ${{ runner.temp }}/canonical-fixtures/**/switched/*.tsv
            ${{ runner.temp }}/canonical-fixtures/**/switched/*.txt
            ${{ runner.temp }}/canonical-fixtures/**/switched/*.json
            ${{ runner.temp }}/canonical-fixtures/**/switched/*.sql
            ${{ runner.temp }}/canonical-fixtures/**/switched/*native-rows
            ${{ runner.temp }}/canonical-fixtures/**/switched/*native-source-output
            ${{ runner.temp }}/canonical-fixtures/**/switched/*expected-failure
            ${{ runner.temp }}/canonical-fixtures/**/switched/*committed-*
          if-no-files-found: error
          retention-days: 7
      - name: Remove generated worker data
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          temporary = Path(os.environ['RUNNER_TEMP'])
          for path in (temporary / 'original-native', temporary / 'canonical-cds',
                       temporary / 'canonical-fixtures', temporary / 'collector-profile',
                       Path('native/target/debug')):
              shutil.rmtree(path, ignore_errors=True)
          PY
