name: CI startup profile
run-name: Historical Hudi Q10 correctness reproduction

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hudi-historical-q10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-q10:
    if: github.repository != 'datafusion-contrib/StreamFusion'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      SF_HUDI_BENCH: 'true'
      SF_ROWS: '2000000'
      SF_WARMUP: '1'
      SF_RUNS: '3'
      SF_HUDI_BACKENDS: rocksdb
      SF_HUDI_MINIBATCHES: 'false'
      SF_MATRIX_QUERIES: q10
      SF_OBJECT_REUSE: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify the original production source and unchanged workload
        run: |
          mkdir -p "$RUNNER_TEMP/hudi-historical/runtime"
          python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          base = '5cf84474a7d2c5e6ee4ca82f16ee2927777c18ae'
          native = '16d4c0052bb61c9a6c783bd03bdafc6c02fe9896'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD^') == base
          assert git('rev-parse', 'HEAD:native') == native
          allowed = {'.github/workflows/ci-profile.yml', 'docs/ci.md',
                     'streamfusion-hudi/src/nexmark/java/tech/streamfusion/NexmarkHudiBenchmark.java'}
          assert set(git('diff', '--name-only', base, 'HEAD').splitlines()) == allowed
          fixtures = ['src/test/java/tech/streamfusion/NexmarkMatrixBenchmark.java',
                      'src/test/java/tech/streamfusion/NexmarkKafkaBenchmark.java',
                      'src/test/java/tech/streamfusion/SortedOutput.java']
          hashes = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in fixtures}
          for name in fixtures:
              assert git('rev-parse', base + ':' + name) == git('rev-parse', 'HEAD:' + name)
          result = dict(original_source=base, diagnostic_head=git('rev-parse', 'HEAD'),
                        native_tree=native, fixture_sha256=hashes,
                        historical_job=132617478396, performance_claim=False)
          output = Path(os.environ['RUNNER_TEMP']) / 'hudi-historical/provenance.json'
          output.write_text(json.dumps(result, indent=2) + '\n')
          PYCODE
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          cache: maven
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: release-hudi
      - name: Rebuild only the original core and Parquet release libraries
        run: >-
          cargo build --manifest-path native/Cargo.toml --release --locked --lib
          -p streamfusion -p streamfusion-parquet
          --features streamfusion/mimalloc,streamfusion-parquet/mimalloc --timings
      - name: Record rebuilt library hashes
        run: |
          sha256sum native/target/release/libstreamfusion.so \
            native/target/release/libstreamfusion_parquet.so \
            > "$RUNNER_TEMP/hudi-historical/libraries.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: hudi-historical-native-${{ github.sha }}
          path: |
            native/target/release/libstreamfusion.so
            native/target/release/libstreamfusion_parquet.so
            ${{ runner.temp }}/hudi-historical/libraries.sha256
            ${{ runner.temp }}/hudi-historical/provenance.json
          if-no-files-found: error
          retention-days: 3
      - name: Resolve the exact released Hudi and Flink dependencies
        run: >-
          python3 bin/ci-maven-dependencies.py --profile hudi,flink-1.18,bench,hudi-nexmark
          --projects streamfusion-hudi --also-make
      - name: Repeat only Q10 with the original three engines and full assertions
        run: |
          set -o pipefail
          mvn -B -ntp -Phudi,flink-1.18,bench,hudi-nexmark \
            -pl streamfusion-hudi -am test -Dnative.build.skip=true \
            -Dnative.test.resource.skip=true -Dmaven.javadoc.skip=true -Dsf.testForks=1 \
            -Dsurefire.failIfNoSpecifiedTests=false -Dtest=NexmarkHudiBenchmark \
            "-Dsf.hudi.benchmark.output=$RUNNER_TEMP/hudi-historical/result.json" \
            "-Dsf.extraJvmArgs=-Djava.library.path=$GITHUB_WORKSPACE/native/target/release -Djava.io.tmpdir=$RUNNER_TEMP/hudi-historical/runtime -Duser.timezone=UTC -Dfile.encoding=UTF-8" \
            2>&1 | tee "$RUNNER_TEMP/hudi-historical/maven.log"
      - name: Require all nine unchanged Q10 timing identities to validate
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'hudi-historical/result.json').read_text())
          assert report['status'] == 'passed', report
          assert report['rows'] == 2000000 and report['input_bids'] == 1840000
          observed = report['observations']
          expected = {(engine, trial) for engine in ('stock', 'previous', 'native') for trial in range(3)}
          assert len(observed) == 9
          assert {(row['engine'], row['trial']) for row in observed} == expected
          for row in observed:
              assert row['query'] == 'q10' and row['backend'] == 'rocksdb' and not row['mini_batch']
              assert row['output_rows'] == 1840000 and row['validation'] == 'full-value multiset'
          print('All nine Q10 identities passed; the historical cause is not established by passing repeats.')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hudi-historical-results-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hudi-historical/*.json
            ${{ runner.temp }}/hudi-historical/*.log
            ${{ runner.temp }}/hudi-historical/*.sha256
            streamfusion-hudi/target/surefire-reports/TEST-tech.streamfusion.NexmarkHudiBenchmark.xml
          if-no-files-found: error
          retention-days: 7
      - name: Remove generated Hudi runtime data
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          import shutil
          shutil.rmtree(Path(os.environ['RUNNER_TEMP']) / 'hudi-historical/runtime', ignore_errors=True)
          PYCODE
